name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bschrib
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/bschrib/schoolday:latest
            ghcr.io/bschrib/schoolday:${{ github.sha }}

      - name: Make package public (so unRAID can pull without login)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PKG_ID=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages?package_type=container&per_page=100" \
            | python3 -c "import sys,json; [print(p['id']) for p in json.load(sys.stdin).get('packages',[]) if p.get('name')=='schoolday']" 2>/dev/null)
          if [ -n "$PKG_ID" ]; then
            echo "Setting package $PKG_ID visibility to public"
            curl -s -X PATCH \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              -d '{"visibility":"public"}' \
              "https://api.github.com/user/packages/$PKG_ID"
            echo
          else
            echo "schoolday package not found; skipping visibility update"
          fi
